services:
  aida-agent:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    init: true
    stop_grace_period: 60s
    # Outbound worker registration only. NPM does not need a hostname for this app.
    expose: ["8081"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
