services:
  aida-agent:
    # Stable name for the reverse proxy upstream; Compose would otherwise append '-1'.
    container_name: aidaagent-aida-agent
    build:
      context: .
      target: runtime
      args:
        BUILD_REVISION: ${BUILD_REVISION:?Export Git HEAD before building}
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:?Export Git committer epoch before building}
        BUILD_DIRTY: ${BUILD_DIRTY:?Export Git dirty state before building}
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-America/Los_Angeles}
    init: true
    stop_grace_period: 60s
    # Internal Docker network only: SDK health and application diagnostics.
    expose: ["8081", "8082"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
