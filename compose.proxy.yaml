# Opt-in overlay: joins the agent to an existing external reverse-proxy network
# so the proxy can reach its health/status listener by container name. Enable on
# a host with COMPOSE_FILE=compose.yaml:compose.proxy.yaml in .env; hosts without
# a proxy network use compose.yaml alone. No host port is published.
services:
  aida-agent:
    networks: [default, proxy]

networks:
  proxy:
    external: true
    name: ${AIDA_PROXY_NETWORK:-npm_network}
