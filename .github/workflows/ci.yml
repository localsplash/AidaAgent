name: AidaAgent
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies, run fake-provider tests, and check worker CLI
        run: |
          scripts/with-build-info.sh sh -c 'docker build --target test --tag aida-agent:test \
            --build-arg BUILD_REVISION --build-arg SOURCE_DATE_EPOCH --build-arg BUILD_DIRTY .'
      - name: Build non-root runtime image
        run: |
          scripts/with-build-info.sh sh -c 'docker build --target runtime --tag aida-agent:runtime \
            --build-arg BUILD_REVISION --build-arg SOURCE_DATE_EPOCH --build-arg BUILD_DIRTY .'
